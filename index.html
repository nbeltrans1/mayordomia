<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mayordomía Familiar</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222637;
    --border: #2e3247;
    --text: #eef0f8;
    --muted: #6b7280;
    --cocolas: #4f8ef7;
    --aleposa: #b87fff;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --radius: 14px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* LOGIN */
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    gap: 32px;
  }

  .login-logo {
    font-size: 52px;
  }

  .login-title {
    text-align: center;
  }

  .login-title h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .login-title p {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }

  .persona-btns {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }

  .persona-btn {
    border: none;
    border-radius: var(--radius);
    padding: 18px 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.1s, opacity 0.1s;
  }

  .persona-btn:active { transform: scale(0.97); opacity: 0.85; }

  .persona-btn.cocolas {
    background: linear-gradient(135deg, #1e3a6e, #2d4f9e);
    color: #a8c4ff;
    border: 1px solid #3a5fa0;
  }

  .persona-btn.aleposa {
    background: linear-gradient(135deg, #2d1a4e, #4a2a7a);
    color: #d4b0ff;
    border: 1px solid #5a3a8a;
  }

  .persona-btn .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .persona-btn.cocolas .avatar { background: rgba(79,142,247,0.25); color: var(--cocolas); }
  .persona-btn.aleposa .avatar { background: rgba(184,127,255,0.25); color: var(--aleposa); }

  .persona-btn .info { text-align: left; }
  .persona-btn .info small { display: block; font-size: 12px; opacity: 0.7; font-weight: 400; margin-top: 2px; }

  /* APP LAYOUT */
  .app { display: none; flex-direction: column; min-height: 100vh; }
  .app.visible { display: flex; }

  /* HEADER */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .app-header .left { display: flex; align-items: center; gap: 10px; }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border-radius: 20px;
    padding: 6px 12px 6px 6px;
    border: 1px solid var(--border);
  }

  .user-pill .dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  .user-pill.cocolas .dot { background: rgba(79,142,247,0.2); color: var(--cocolas); }
  .user-pill.aleposa .dot { background: rgba(184,127,255,0.2); color: var(--aleposa); }
  .user-pill span { font-size: 13px; font-weight: 500; }

  .btn-switch {
    background: none; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
    color: var(--muted); font-size: 12px; cursor: pointer;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
  }

  .tab-btn {
    background: none; border: none;
    padding: 12px 14px;
    color: var(--muted); font-size: 13px;
    cursor: pointer; border-bottom: 2px solid transparent;
    font-weight: 500; white-space: nowrap;
    transition: color 0.15s;
  }

  .tab-btn.active { color: var(--text); border-bottom-color: var(--cocolas); }

  /* CONTENT */
  .tab-content { display: none; flex: 1; padding: 16px; overflow-y: auto; }
  .tab-content.active { display: block; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* METRICS GRID */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .metric-card label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .metric-card .val {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .val.green { color: var(--green); }
  .val.red { color: var(--red); }
  .val.yellow { color: var(--yellow); }

  /* PERSONA CARDS */
  .persona-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .persona-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px;
    border: 1px solid var(--border);
  }

  .persona-card.cocolas { border-top: 2px solid var(--cocolas); }
  .persona-card.aleposa { border-top: 2px solid var(--aleposa); }

  .persona-card .name {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .persona-card.cocolas .name { color: var(--cocolas); }
  .persona-card.aleposa .name { color: var(--aleposa); }

  .persona-stat { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .persona-stat span:last-child { color: var(--text); font-weight: 500; }

  .disponible-tag {
    margin-top: 10px;
    background: rgba(52,211,153,0.1);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
  }

  .disponible-tag.negativo { background: rgba(248,113,113,0.1); color: var(--red); }

  /* REGISTER FORM */
  .register-form { display: flex; flex-direction: column; gap: 14px; }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus { border-color: var(--cocolas); }

  .amount-input {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -1px;
    color: var(--green);
  }

  .cats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .cat-btn .icon { font-size: 20px; }
  .cat-btn:active { transform: scale(0.95); }
  .cat-btn.selected { background: rgba(79,142,247,0.15); border-color: var(--cocolas); color: var(--cocolas); }

  .resp-toggle {
    display: flex;
    gap: 8px;
  }

  .resp-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .resp-btn.active.cocolas { background: rgba(79,142,247,0.15); border-color: var(--cocolas); color: var(--cocolas); }
  .resp-btn.active.aleposa { background: rgba(184,127,255,0.15); border-color: var(--aleposa); color: var(--aleposa); }

  .btn-registrar {
    background: linear-gradient(135deg, #2563eb, #4f8ef7);
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.15s, transform 0.1s;
  }

  /* TIPO TOGGLE */
  .tipo-toggle { display: flex; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .tipo-btn { flex: 1; border: none; background: none; color: var(--muted); font-size: 15px; font-weight: 600; padding: 11px; border-radius: 9px; cursor: pointer; transition: all 0.15s; }
  .tipo-btn.active.gasto { background: rgba(248,113,113,0.15); color: var(--red); }
  .tipo-btn.active.ingreso { background: rgba(52,211,153,0.15); color: var(--green); }
  .amount-input.gasto { color: var(--red); }
  .amount-input.ingreso { color: var(--green); }
  .register-form.ingreso .cat-btn.selected { background: rgba(52,211,153,0.15); border-color: var(--green); color: var(--green); }
  .register-form.gasto .cat-btn.selected { background: rgba(248,113,113,0.12); border-color: var(--red); color: var(--red); }
  .btn-registrar.ingreso { background: linear-gradient(135deg, #059669, #34d399); }
  .btn-registrar.gasto { background: linear-gradient(135deg, #dc2626, #f87171); }

  /* ELIMINAR */
  .trans-right { display: flex; align-items: center; gap: 10px; }
  .btn-del { background: none; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-del:active { transform: scale(0.92); background: rgba(248,113,113,0.12); }
  .btn-del:disabled { opacity: 0.4; }

  .btn-registrar:active { opacity: 0.85; transform: scale(0.98); }
  .btn-registrar:disabled { opacity: 0.5; cursor: not-allowed; }

  /* BAR */
  .bar-wrap { margin-bottom: 12px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .bar-label strong { color: var(--text); }
  .bar-track { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }

  /* CALENDAR */
  .cal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .cal-row:last-child { border-bottom: none; }

  .cal-row .desc { color: var(--text); }
  .cal-row .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cal-row .monto { font-weight: 600; }
  .cal-row .check { font-size: 16px; }

  .day-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 14px 0 6px;
  }

  /* ALERT */
  .alert {
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 13px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .alert.red { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--red); }
  .alert.green { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--green); }
  .alert.yellow { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.2); color: var(--yellow); }

  /* TRANS LIST */
  .trans-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .trans-row:last-child { border-bottom: none; }
  .trans-desc { font-size: 13px; }
  .trans-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .trans-amount { font-weight: 600; font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s ease;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.visible { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(52,211,153,0.4); color: var(--green); }
  .toast.error { border-color: rgba(248,113,113,0.4); color: var(--red); }

  /* SPINNER */
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--cocolas);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-state {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 32px; color: var(--muted); font-size: 14px;
  }

  /* DEUDAS */
  .deuda-row {
    margin-bottom: 16px;
  }

  /* VERSE */
  .verse {
    border-left: 2px solid var(--green);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    margin-top: 8px;
    background: rgba(52,211,153,0.05);
    border-radius: 0 8px 8px 0;
  }

  /* URGENTE TAG */
  .urgente-tag {
    background: rgba(248,113,113,0.15);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
  }

  .vencido-tag {
    background: rgba(251,191,36,0.15);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--yellow);
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: 14px;
  }

  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">💰</div>
  <div class="login-title">
    <h1>Mayordomía Familiar</h1>
    <p>Cocolas & Aleposa · Bogotá</p>
  </div>
  <div class="persona-btns">
    <button class="persona-btn cocolas" onclick="login('COCOLAS')">
      <div class="avatar">NC</div>
      <div class="info">
        Cocolas
        <small>Obligaciones principales</small>
      </div>
    </button>
    <button class="persona-btn aleposa" onclick="login('ALEPOSA')">
      <div class="avatar">AP</div>
      <div class="info">
        Aleposa 💜
        <small>Gestora del hogar</small>
      </div>
    </button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <!-- HEADER -->
  <div class="app-header">
    <div class="left">
      <div class="user-pill" id="userPill">
        <div class="dot" id="userDot"></div>
        <span id="userName"></span>
      </div>
    </div>
    <button class="btn-switch" onclick="logout()">Cambiar</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('inicio',this)">Inicio</button>
    <button class="tab-btn" onclick="showTab('registrar',this)">+ Registrar</button>
    <button class="tab-btn" onclick="showTab('calendario',this)">Pagos</button>
    <button class="tab-btn" onclick="showTab('deudas',this)">Deudas</button>
  </div>

  <!-- TAB INICIO -->
  <div class="tab-content active" id="tab-inicio">
    <div id="inicioContent"><div class="loading-state"><div class="spinner"></div> Cargando...</div></div>
  </div>

  <!-- TAB REGISTRAR -->
  <div class="tab-content" id="tab-registrar">
    <div class="card">
      <div class="card-title">Nuevo registro</div>
      <div class="register-form gasto" id="registerForm">

        <div class="tipo-toggle">
          <button class="tipo-btn active gasto" id="btnTipoGasto" onclick="setTipo('GASTO')">🧾 Gasto</button>
          <button class="tipo-btn" id="btnTipoIngreso" onclick="setTipo('INGRESO')">💰 Ingreso</button>
        </div>

        <div class="form-group">
          <label>Monto</label>
          <input type="number" class="form-input amount-input gasto" id="inputMonto" placeholder="0" inputmode="numeric">
        </div>

        <div class="form-group">
          <label>Descripción (opcional)</label>
          <input type="text" class="form-input" id="inputDesc" placeholder="Ej: Compra mercado semanal">
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <div class="cats-grid" id="catsGrid"></div>
        </div>

        <div class="form-group">
          <label>Responsable</label>
          <div class="resp-toggle">
            <button class="resp-btn active cocolas" id="btnCocolas" onclick="setResp('COCOLAS')">💙 Cocolas</button>
            <button class="resp-btn aleposa" id="btnAleposa" onclick="setResp('ALEPOSA')">💜 Aleposa</button>
          </div>
        </div>

        <button class="btn-registrar gasto" id="btnRegistrar" onclick="registrarGasto()">Registrar gasto</button>
      </div>
    </div>
  </div>

  <!-- TAB CALENDARIO -->
  <div class="tab-content" id="tab-calendario">
    <div id="calContent"><div class="loading-state"><div class="spinner"></div> Cargando...</div></div>
  </div>

  <!-- TAB DEUDAS -->
  <div class="tab-content" id="tab-deudas">
    <div id="deudasContent"><div class="loading-state"><div class="spinner"></div> Cargando...</div></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyS_bTZ1u0tmc6vx5bNOB-c8qedEfvpKQSGK7fZKDWrzPUFd9IwINqQEcqVMYMfExGyog/exec';

const CATS = [
  {id:'MERCADO', icon:'🛒', label:'Mercado'},
  {id:'MOTO', icon:'🏍️', label:'Moto'},
  {id:'ARRIENDO', icon:'🏠', label:'Arriendo'},
  {id:'COLEGIO', icon:'📚', label:'Colegio'},
  {id:'DIEZMO', icon:'⛪', label:'Diezmo'},
  {id:'SERVICIOS', icon:'💡', label:'Servicios'},
  {id:'GATAS', icon:'🐱', label:'Gatas'},
  {id:'TRANSPORTE', icon:'🚌', label:'Transporte'},
  {id:'SALUD', icon:'💊', label:'Salud'},
  {id:'HOGAR', icon:'🛋️', label:'Hogar'},
  {id:'TARJETA_CREDITO', icon:'💳', label:'Tarjeta Nu'},
  {id:'AHORRO', icon:'🏦', label:'Ahorro'},
  {id:'IMPREVISTOS', icon:'⚠️', label:'Imprevisto'},
  {id:'GASTOS_HORMIGA', icon:'🐜', label:'Hormiga'},
  {id:'CUOTA_MARTINA', icon:'👧', label:'Martina'},
  {id:'OTROS', icon:'📦', label:'Otros'},
];

const CATS_INGRESO = [
  {id:'QUINCENA', icon:'💼', label:'Quincena'},
  {id:'PRIMA', icon:'🎁', label:'Prima'},
  {id:'INGRESO_EXTRA', icon:'✨', label:'Extra'},
  {id:'REEMBOLSO', icon:'↩️', label:'Reembolso'},
  {id:'REGALO', icon:'💝', label:'Regalo'},
  {id:'INGRESO', icon:'💰', label:'Otro ingreso'},
];

let tipoSeleccionado = 'GASTO';

function catsActuales() {
  return tipoSeleccionado === 'INGRESO' ? CATS_INGRESO : CATS;
}

function catDefault() {
  return tipoSeleccionado === 'INGRESO' ? 'QUINCENA' : 'OTROS';
}

function setTipo(t) {
  tipoSeleccionado = t;
  const esIng = t === 'INGRESO';
  const clase = esIng ? 'ingreso' : 'gasto';
  document.getElementById('btnTipoGasto').className = 'tipo-btn' + (!esIng ? ' active gasto' : '');
  document.getElementById('btnTipoIngreso').className = 'tipo-btn' + (esIng ? ' active ingreso' : '');
  document.getElementById('registerForm').className = 'register-form ' + clase;
  document.getElementById('inputMonto').className = 'form-input amount-input ' + clase;
  const btn = document.getElementById('btnRegistrar');
  btn.className = 'btn-registrar ' + clase;
  btn.textContent = esIng ? 'Registrar ingreso' : 'Registrar gasto';
  document.getElementById('inputDesc').placeholder = esIng ? 'Ej: Quincena octubre' : 'Ej: Compra mercado semanal';
  catSeleccionada = catDefault();
  buildCatsGrid();
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let usuario = localStorage.getItem('mayordomia_user') || null;
let catSeleccionada = 'OTROS';
let respSeleccionado = 'COCOLAS';
let dashData = null;

function fmt(n) {
  return '$' + Math.round(Math.abs(n||0)).toLocaleString('es-CO');
}

function pct(a, b) {
  return b > 0 ? Math.min(100, Math.round((a/b)*100)) : 0;
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function login(persona) {
  usuario = persona;
  localStorage.setItem('mayordomia_user', persona);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  setupUser();
  cargarDatos();
  buildCatsGrid();
  setResp(persona);
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
}

function setupUser() {
  const pill = document.getElementById('userPill');
  const dot = document.getElementById('userDot');
  const name = document.getElementById('userName');
  if (usuario === 'COCOLAS') {
    pill.className = 'user-pill cocolas';
    dot.textContent = 'NC';
    name.textContent = 'Cocolas';
  } else {
    pill.className = 'user-pill aleposa';
    dot.textContent = 'AP';
    name.textContent = 'Aleposa';
  }
}

function showTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
  if (name === 'inicio' && dashData) renderInicio();
  if (name === 'calendario' && dashData) renderCalendario();
  if (name === 'deudas' && dashData) renderDeudas();
}

function buildCatsGrid() {
  const grid = document.getElementById('catsGrid');
  grid.innerHTML = '';
  catsActuales().forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (c.id === catSeleccionada ? ' selected' : '');
    btn.innerHTML = `<span class="icon">${c.icon}</span>${c.label}`;
    btn.onclick = () => selectCat(c.id);
    btn.id = 'cat_' + c.id;
    grid.appendChild(btn);
  });
}

function selectCat(id) {
  catSeleccionada = id;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  const btn = document.getElementById('cat_' + id);
  if (btn) btn.classList.add('selected');
}

function setResp(r) {
  respSeleccionado = r;
  document.getElementById('btnCocolas').className = 'resp-btn' + (r==='COCOLAS' ? ' active cocolas' : '');
  document.getElementById('btnAleposa').className = 'resp-btn' + (r==='ALEPOSA' ? ' active aleposa' : '');
}

async function cargarDatos() {
  try {
    const resp = await fetch(WEBAPP_URL + '?action=getDashboard&t=' + Date.now());
    const data = await resp.json();
    dashData = data;
    renderInicio();
  } catch(e) {
    document.getElementById('inicioContent').innerHTML = `<div class="alert red">❌ Error al cargar datos. Verifica la conexión.</div>`;
  }
}

function renderInicio() {
  if (!dashData) return;
  const d = dashData;
  const ingC = d.ingC || 0, gasC = d.gasC || 0;
  const ingA = d.ingA || 0, gasA = d.gasA || 0;
  const saldoC = ingC - gasC, saldoA = ingA - gasA;
  const saldoFam = (d.saldo || 0);
  const hoy = new Date().getDate();

  let html = '';

  // Alertas pagos urgentes
  const cal = d.calendario || [];
  const vencidos = cal.filter(c => c.pagado === 'NO' && parseInt(c.dia) < hoy);
  const hoyPagos = cal.filter(c => c.pagado === 'NO' && parseInt(c.dia) === hoy);
  const proximos = cal.filter(c => c.pagado === 'NO' && parseInt(c.dia) > hoy && parseInt(c.dia) <= hoy+3);

  if (vencidos.length > 0) {
    vencidos.forEach(p => {
      html += `<div class="alert red">🚨 VENCIDO día ${p.dia} — ${p.descripcion} <strong>${fmt(p.monto)}</strong></div>`;
    });
  }
  if (hoyPagos.length > 0) {
    hoyPagos.forEach(p => {
      html += `<div class="alert yellow">🔴 HOY — ${p.descripcion} <strong>${fmt(p.monto)}</strong></div>`;
    });
  }

  // Métricas
  html += `<div class="metrics-grid">
    <div class="metric-card">
      <label>Ingresos familia</label>
      <div class="val green">${fmt(ingC+ingA)}</div>
    </div>
    <div class="metric-card">
      <label>Gastos familia</label>
      <div class="val yellow">${fmt(gasC+gasA)}</div>
    </div>
    <div class="metric-card">
      <label>Saldo familiar</label>
      <div class="val ${saldoFam>=0?'green':'red'}">${fmt(saldoFam)}</div>
    </div>
    <div class="metric-card">
      <label>Cuotas mes</label>
      <div class="val red">${fmt(d.cuotas||0)}</div>
    </div>
  </div>`;

  // Tarjetas persona
  html += `<div class="persona-cards">
    <div class="persona-card cocolas">
      <div class="name">💙 Cocolas</div>
      <div class="persona-stat"><span>Ingresos</span><span>${fmt(ingC)}</span></div>
      <div class="persona-stat"><span>Gastos</span><span>${fmt(gasC)}</span></div>
      <div class="disponible-tag ${saldoC<0?'negativo':''}">${saldoC<0?'-':''}${fmt(Math.abs(saldoC))}</div>
    </div>
    <div class="persona-card aleposa">
      <div class="name">💜 Aleposa</div>
      <div class="persona-stat"><span>Ingresos</span><span>${fmt(ingA)}</span></div>
      <div class="persona-stat"><span>Gastos</span><span>${fmt(gasA)}</span></div>
      <div class="disponible-tag ${saldoA<0?'negativo':''}">${saldoA<0?'-':''}${fmt(Math.abs(saldoA))}</div>
    </div>
  </div>`;

  // Últimas transacciones
  const recientes = (d.recientes || []).slice(0, 8);
  html += `<div class="card"><div class="card-title">Últimas transacciones</div>`;
  if (recientes.length === 0) {
    html += `<div class="empty-state"><div class="icon">📭</div>Sin transacciones aún</div>`;
  } else {
    recientes.forEach((t, i) => {
      const esIng = t.tipo === 'INGRESO';
      const btnDel = t.fila ? `<button class="btn-del" id="del_${i}" onclick="eliminarRegistro(${i})" aria-label="Eliminar registro">🗑️</button>` : '';
      html += `<div class="trans-row">
        <div>
          <div class="trans-desc">${esc(t.descripcion)}</div>
          <div class="trans-meta">${esc(t.categoria)} · ${esc(t.fecha)} · ${esc(t.responsable)}</div>
        </div>
        <div class="trans-right">
          <div class="trans-amount" style="color:${esIng?'var(--green)':'var(--red)'}">${esIng?'+':'-'}${fmt(t.monto)}</div>
          ${btnDel}
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="verse">"El que es fiel en lo muy poco, también en lo más es fiel." — Lucas 16:10</div>`;

  document.getElementById('inicioContent').innerHTML = html;
}

function renderCalendario() {
  if (!dashData) return;
  const cal = dashData.calendario || [];
  const hoy = new Date().getDate();
  let html = '';
  const pagadosMonto = cal.filter(c=>c.pagado==='SI').reduce((s,c)=>s+parseFloat(c.monto||0),0);
  const pendientesMonto = cal.filter(c=>c.pagado==='NO').reduce((s,c)=>s+parseFloat(c.monto||0),0);
  const pctPagado = pct(pagadosMonto, pagadosMonto+pendientesMonto);

  html += `<div class="card">
    <div class="card-title">Progreso del mes</div>
    <div class="bar-wrap">
      <div class="bar-label"><span style="color:var(--muted)">Pagado</span><strong>${fmt(pagadosMonto)} / ${fmt(pagadosMonto+pendientesMonto)}</strong></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pctPagado}%;background:var(--green)"></div></div>
    </div>
    <div style="text-align:center;font-size:24px;font-weight:700;color:${pctPagado>70?'var(--green)':'var(--yellow)'}">${pctPagado}%</div>
  </div>`;

  html += `<div class="card"><div class="card-title">Calendario de pagos</div>`;
  [13,15,28,30].forEach(dia => {
    const pagosDelDia = cal.filter(c => parseInt(c.dia) === dia);
    if (pagosDelDia.length === 0) return;
    const esHoy = dia === hoy;
    const esVencido = dia < hoy;
    const esPronto = dia > hoy && dia <= hoy+3;
    html += `<div class="day-label" style="color:${esHoy||esVencido?'var(--red)':(esPronto?'var(--yellow)':'var(--muted)')}">
      Día ${dia}${esHoy?' — HOY':(esVencido?' — VENCIDO':(esPronto?' — Próximo':''))}
    </div>`;
    pagosDelDia.forEach(c => {
      html += `<div class="cal-row">
        <div>
          <div class="desc">${c.descripcion}</div>
          <div class="meta">${c.responsable}${c.fechaReal?' · ✔ '+c.fechaReal:''}</div>
        </div>
        <div style="text-align:right">
          <div class="monto" style="color:${c.pagado==='SI'?'var(--green)':'var(--red)'}">${fmt(c.monto)}</div>
          <div class="check">${c.pagado==='SI'?'✅':'⏳'}</div>
        </div>
      </div>`;
    });
  });
  html += `</div>`;
  document.getElementById('calContent').innerHTML = html;
}

function renderDeudas() {
  if (!dashData) return;
  const deudas = dashData.deudas || [];
  const metas = dashData.metas || [];
  let html = '';

  html += `<div class="card"><div class="card-title">Estado de deudas</div>`;
  deudas.forEach(d => {
    const pv = pct(d.saldoInicial - d.saldo, d.saldoInicial);
    html += `<div class="deuda-row">
      <div class="bar-wrap">
        <div class="bar-label"><strong>${d.nombre}</strong><span style="color:var(--red)">${fmt(d.saldo)} restantes</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pv}%;background:var(--green)"></div></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${pv}% pagado · ${d.meses} meses · Límite: ${d.fechaLimite||'—'}</div>
      ${d.intereses&&d.intereses!=='incluido en cuota'?`<div style="font-size:11px;color:var(--red);margin-top:2px">Intereses este mes: ${fmt(d.intereses)}</div>`:''}
    </div>`;
  });
  html += `</div>`;

  html += `<div class="card"><div class="card-title">Metas activas</div>`;
  metas.forEach(m => {
    const pv = pct(m.acumulado, m.objetivo);
    const color = pv > 70 ? 'var(--green)' : pv > 30 ? 'var(--cocolas)' : 'var(--yellow)';
    html += `<div class="deuda-row">
      <div class="bar-wrap">
        <div class="bar-label"><strong>${m.nombre}</strong><span>${fmt(m.acumulado)} / ${fmt(m.objetivo)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pv}%;background:${color}"></div></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${pv}% · ${m.estado}</div>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="verse">"Los planes bien pensados dan buen resultado." — Proverbios 21:5</div>`;
  document.getElementById('deudasContent').innerHTML = html;
}

async function registrarGasto() {
  const monto = parseFloat(document.getElementById('inputMonto').value);
  const desc = document.getElementById('inputDesc').value.trim();
  const btn = document.getElementById('btnRegistrar');

  if (!monto || monto < 500) {
    showToast('Ingresa un monto válido (mínimo $500)', 'error');
    return;
  }

  if (!catSeleccionada) {
    showToast('Selecciona una categoría', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Registrando...';

  const tipo = tipoSeleccionado;
  const label = catsActuales().find(c=>c.id===catSeleccionada)?.label || catSeleccionada;
  const nombreResp = respSeleccionado === 'COCOLAS' ? 'Cocolas' : 'Aleposa';
  const descripcion = desc || (catSeleccionada === 'QUINCENA' ? 'Quincena ' + nombreResp : label);

  try {
    const params = new URLSearchParams({
      action: 'registrar',
      descripcion,
      categoria: catSeleccionada,
      tipo,
      monto,
      responsable: respSeleccionado
    });

    const resp = await fetch(WEBAPP_URL + '?' + params.toString());
    const result = await resp.json();

    if (result.ok) {
      showToast(`${tipo==='INGRESO'?'💰':'🧾'} ${descripcion} — ${fmt(monto)} registrado`, 'success');
      document.getElementById('inputMonto').value = '';
      document.getElementById('inputDesc').value = '';
      catSeleccionada = catDefault();
      buildCatsGrid();
      await cargarDatos();
      showTab('inicio', document.querySelectorAll('.tab-btn')[0]);
    } else {
      showToast('Error al registrar: ' + (result.error||'intenta de nuevo'), 'error');
    }
  } catch(e) {
    showToast('Error de conexión', 'error');
  }

  btn.disabled = false;
  btn.textContent = tipoSeleccionado === 'INGRESO' ? 'Registrar ingreso' : 'Registrar gasto';
}

async function eliminarRegistro(i) {
  const t = (dashData && dashData.recientes || [])[i];
  if (!t || !t.fila) return;
  const signo = t.tipo === 'INGRESO' ? '+' : '-';
  if (!confirm(`¿Eliminar este registro?\n\n${t.descripcion}\n${signo}${fmt(t.monto)} · ${t.fecha} · ${t.responsable}\n\nSe borrará también del Sheets.`)) return;

  const btn = document.getElementById('del_' + i);
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:14px;height:14px"></div>'; }

  try {
    const params = new URLSearchParams({
      action: 'eliminar',
      fila: t.fila,
      descripcion: t.descripcion,
      monto: t.monto
    });
    const resp = await fetch(WEBAPP_URL + '?' + params.toString());
    const result = await resp.json();
    if (result.ok) {
      showToast('🗑️ Registro eliminado', 'success');
      await cargarDatos();
    } else {
      showToast(result.error || 'No se pudo eliminar. Recarga e intenta de nuevo.', 'error');
      await cargarDatos();
    }
  } catch(e) {
    showToast('Error de conexión. El registro no se eliminó.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '🗑️'; }
  }
}

// Init
if (usuario) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  setupUser();
  cargarDatos();
  buildCatsGrid();
  setResp(usuario);
}
</script>
</body>
</html>
