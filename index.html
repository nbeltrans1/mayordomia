<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mayordomía Familiar</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222637;
    --border: #2e3247;
    --text: #eef0f8;
    --muted: #6b7280;
    --cocolas: #4f8ef7;
    --aleposa: #b87fff;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --radius: 14px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* LOGIN */
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    gap: 32px;
  }

  .login-logo {
    font-size: 52px;
  }

  .login-title {
    text-align: center;
  }

  .login-title h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .login-title p {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }

  .persona-btns {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }

  .persona-btn {
    border: none;
    border-radius: var(--radius);
    padding: 18px 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.1s, opacity 0.1s;
  }

  .persona-btn:active { transform: scale(0.97); opacity: 0.85; }

  .persona-btn.cocolas {
    background: linear-gradient(135deg, #1e3a6e, #2d4f9e);
    color: #a8c4ff;
    border: 1px solid #3a5fa0;
  }

  .persona-btn.aleposa {
    background: linear-gradient(135deg, #2d1a4e, #4a2a7a);
    color: #d4b0ff;
    border: 1px solid #5a3a8a;
  }

  .persona-btn .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .persona-btn.cocolas .avatar { background: rgba(79,142,247,0.25); color: var(--cocolas); }
  .persona-btn.aleposa .avatar { background: rgba(184,127,255,0.25); color: var(--aleposa); }

  /* MOVIMIENTOS DEL MES */
  .btn-ver-todos { width: 100%; margin-top: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 600; padding: 12px; cursor: pointer; }
  .mov-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  .mov-overlay.visible { display: flex; }
  .mov-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .mov-header .mes { font-size: 16px; font-weight: 700; text-transform: capitalize; }
  .mov-nav { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; }
  .mov-nav:disabled { opacity: 0.3; }
  .mov-body { flex: 1; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 520px; width: 100%; margin: 0 auto; }
  .mov-filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .mov-filtro { background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 7px 12px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .mov-filtro.active { color: var(--text); border-color: var(--cocolas); background: rgba(79,142,247,0.15); }
  .mov-resumen { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .mov-resumen div { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .mov-resumen small { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .mov-resumen strong { font-size: 13px; }

  /* VINCULAR CON PAGO DEL CALENDARIO */
  .pagos-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pago-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; color: var(--muted); font-size: 12px; cursor: pointer; text-align: left; }
  .pago-chip small { opacity: 0.8; margin-left: 4px; }
  .pago-chip.selected { border-color: var(--cocolas); color: var(--text); background: rgba(79,142,247,0.15); }
  .pago-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* FOTOS DE PERFIL */
  .persona-btn .avatar, .user-pill .dot { position: relative; overflow: visible; background-size: cover; background-position: center; }
  .avatar.con-foto, .dot.con-foto { color: transparent !important; }
  .foto-badge { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .user-pill .dot { cursor: pointer; }
  .foto-tip { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

  .persona-btn .info { text-align: left; }
  .persona-btn .info small { display: block; font-size: 12px; opacity: 0.7; font-weight: 400; margin-top: 2px; }

  /* APP LAYOUT */
  .app { display: none; flex-direction: column; min-height: 100vh; }
  .app.visible { display: flex; }

  /* HEADER */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .app-header .left { display: flex; align-items: center; gap: 10px; }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border-radius: 20px;
    padding: 6px 12px 6px 6px;
    border: 1px solid var(--border);
  }

  .user-pill .dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  .user-pill.cocolas .dot { background: rgba(79,142,247,0.2); color: var(--cocolas); }
  .user-pill.aleposa .dot { background: rgba(184,127,255,0.2); color: var(--aleposa); }
  .user-pill span { font-size: 13px; font-weight: 500; }

  .btn-switch {
    background: none; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
    color: var(--muted); font-size: 12px; cursor: pointer;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
  }

  .tab-btn {
    background: none; border: none;
    padding: 12px 14px;
    color: var(--muted); font-size: 13px;
    cursor: pointer; border-bottom: 2px solid transparent;
    font-weight: 500; white-space: nowrap;
    transition: color 0.15s;
  }

  .tab-btn.active { color: var(--text); border-bottom-color: var(--cocolas); }

  /* CONTENT */
  .tab-content { display: none; flex: 1; padding: 16px; overflow-y: auto; }
  .tab-content.active { display: block; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* METRICS GRID */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .metric-card label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .metric-card .val {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .val.green { color: var(--green); }
  .val.red { color: var(--red); }
  .val.yellow { color: var(--yellow); }

  /* PERSONA CARDS */
  .persona-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .persona-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px;
    border: 1px solid var(--border);
  }

  .persona-card.cocolas { border-top: 2px solid var(--cocolas); }
  .persona-card.aleposa { border-top: 2px solid var(--aleposa); }

  .persona-card .name {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .persona-card.cocolas .name { color: var(--cocolas); }
  .persona-card.aleposa .name { color: var(--aleposa); }

  .persona-stat { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .persona-stat span:last-child { color: var(--text); font-weight: 500; }

  .disponible-tag {
    margin-top: 10px;
    background: rgba(52,211,153,0.1);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
  }

  .disponible-tag.negativo { background: rgba(248,113,113,0.1); color: var(--red); }

  /* REGISTER FORM */
  .register-form { display: flex; flex-direction: column; gap: 14px; }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus { border-color: var(--cocolas); }

  .amount-input {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -1px;
    color: var(--green);
  }

  .cats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .cat-btn .icon { font-size: 20px; }
  .cat-btn:active { transform: scale(0.95); }
  .cat-btn.selected { background: rgba(79,142,247,0.15); border-color: var(--cocolas); color: var(--cocolas); }

  .resp-toggle {
    display: flex;
    gap: 8px;
  }

  .resp-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .resp-btn.active.cocolas { background: rgba(79,142,247,0.15); border-color: var(--cocolas); color: var(--cocolas); }
  .resp-btn.active.aleposa { background: rgba(184,127,255,0.15); border-color: var(--aleposa); color: var(--aleposa); }

  .btn-registrar {
    background: linear-gradient(135deg, #2563eb, #4f8ef7);
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.15s, transform 0.1s;
  }

  /* TIPO TOGGLE */
  .tipo-toggle { display: flex; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .tipo-btn { flex: 1; border: none; background: none; color: var(--muted); font-size: 15px; font-weight: 600; padding: 11px; border-radius: 9px; cursor: pointer; transition: all 0.15s; }
  .tipo-btn.active.gasto { background: rgba(248,113,113,0.15); color: var(--red); }
  .tipo-btn.active.ingreso { background: rgba(52,211,153,0.15); color: var(--green); }
  .amount-input.gasto { color: var(--red); }
  .amount-input.ingreso { color: var(--green); }
  .register-form.ingreso .cat-btn.selected { background: rgba(52,211,153,0.15); border-color: var(--green); color: var(--green); }
  .register-form.gasto .cat-btn.selected { background: rgba(248,113,113,0.12); border-color: var(--red); color: var(--red); }
  .btn-registrar.ingreso { background: linear-gradient(135deg, #059669, #34d399); }
  .btn-registrar.gasto { background: linear-gradient(135deg, #dc2626, #f87171); }

  /* ELIMINAR */
  .trans-right { display: flex; align-items: center; gap: 10px; }
  .btn-del { background: none; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-del:active { transform: scale(0.92); background: rgba(248,113,113,0.12); }
  .btn-del:disabled { opacity: 0.4; }

  .btn-registrar:active { opacity: 0.85; transform: scale(0.98); }
  .btn-registrar:disabled { opacity: 0.5; cursor: not-allowed; }

  /* BAR */
  .bar-wrap { margin-bottom: 12px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .bar-label strong { color: var(--text); }
  .bar-track { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }

  /* CALENDAR */
  .cal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .cal-row:last-child { border-bottom: none; }

  .cal-row .desc { color: var(--text); }
  .cal-row .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cal-row .monto { font-weight: 600; }
  .cal-row .check { font-size: 16px; }

  .day-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 14px 0 6px;
  }

  /* ALERT */
  .alert {
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 13px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .alert.red { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--red); }
  .alert.green { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--green); }
  .alert.yellow { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.2); color: var(--yellow); }

  /* TRANS LIST */
  .trans-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .trans-row:last-child { border-bottom: none; }
  .trans-desc { font-size: 13px; }
  .trans-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .trans-amount { font-weight: 600; font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s ease;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.visible { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(52,211,153,0.4); color: var(--green); }
  .toast.error { border-color: rgba(248,113,113,0.4); color: var(--red); }

  /* SPINNER */
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--cocolas);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-state {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 32px; color: var(--muted); font-size: 14px;
  }

  /* DEUDAS */
  .deuda-row {
    margin-bottom: 16px;
  }

  /* VERSE */
  .verse {
    border-left: 2px solid var(--green);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    margin-top: 8px;
    background: rgba(52,211,153,0.05);
    border-radius: 0 8px 8px 0;
  }

  /* URGENTE TAG */
  .urgente-tag {
    background: rgba(248,113,113,0.15);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
  }

  .vencido-tag {
    background: rgba(251,191,36,0.15);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--yellow);
    font-weight: 600;
  }

  /* PLAN MOTO */
  .moto-resumen { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .moto-resumen div { background: var(--surface2); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .moto-resumen small { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .moto-resumen strong { font-size: 14px; }
  .chart-wrap { margin: 4px 0 14px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .plan-scroll { max-height: 340px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .plan-table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  .plan-table th { position: sticky; top: 0; background: var(--surface2); color: var(--muted); font-weight: 600; text-align: right; padding: 8px 6px; }
  .plan-table th:first-child, .plan-table td:first-child { text-align: left; }
  .plan-table td { padding: 8px 6px; text-align: right; border-top: 1px solid var(--border); white-space: nowrap; }
  .plan-table tr.pagada td { color: var(--muted); }
  .plan-table tr.proxima td { background: rgba(79,142,247,0.1); color: var(--text); font-weight: 600; }
  .plan-nota { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: 14px;
  }

  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">💰</div>
  <div class="login-title">
    <h1>Mayordomía Familiar</h1>
    <p>Cocolas & Aleposa · Bogotá</p>
  </div>
  <div class="persona-btns">
    <button class="persona-btn cocolas" onclick="login('COCOLAS')">
      <div class="avatar" id="avatarCOCOLAS" onclick="elegirFoto(event,'COCOLAS')">NC<span class="foto-badge">📷</span></div>
      <div class="info">
        Cocolas
        <small>Obligaciones principales</small>
      </div>
    </button>
    <button class="persona-btn aleposa" onclick="login('ALEPOSA')">
      <div class="avatar" id="avatarALEPOSA" onclick="elegirFoto(event,'ALEPOSA')">AP<span class="foto-badge">📷</span></div>
      <div class="info">
        Aleposa 💜
        <small>Gestora del hogar</small>
      </div>
    </button>
  </div>
  <div class="foto-tip">Toca el 📷 para poner una foto de perfil</div>
  <input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="guardarFoto(this)">
</div>

<!-- APP -->
<div class="app" id="app">
  <!-- HEADER -->
  <div class="app-header">
    <div class="left">
      <div class="user-pill" id="userPill">
        <div class="dot" id="userDot" onclick="elegirFoto(event, usuario)" title="Cambiar foto"></div>
        <span id="userName"></span>
      </div>
    </div>
    <button class="btn-switch" onclick="logout()">Cambiar</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('inicio',this)">Inicio</button>
    <button class="tab-btn" onclick="showTab('registrar',this)">+ Registrar</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyS_bTZ1u0tmc6vx5bNOB-c8qedEfvpKQSGK7fZKDWrzPUFd9IwINqQEcqVMYMfExGyog/exec';

const CATS = [
  {id:'MERCADO', icon:'🛒', label:'Mercado'},
  {id:'MOTO', icon:'🏍️', label:'Moto'},
  {id:'ARRIENDO', icon:'🏠', label:'Arriendo'},
  {id:'COLEGIO', icon:'📚', label:'Colegio'},
  {id:'DIEZMO', icon:'⛪', label:'Diezmo'},
  {id:'SERVICIOS', icon:'💡', label:'Servicios'},
  {id:'GATAS', icon:'🐱', label:'Gatas'},
  {id:'TRANSPORTE', icon:'🚌', label:'Transporte'},
  {id:'SALUD', icon:'💊', label:'Salud'},
  {id:'HOGAR', icon:'🛋️', label:'Hogar'},
  {id:'TARJETA_CREDITO', icon:'💳', label:'Tarjeta Nu'},
  {id:'AHORRO', icon:'🏦', label:'Ahorro'},
  {id:'IMPREVISTOS', icon:'⚠️', label:'Imprevisto'},
  {id:'GASTOS_HORMIGA', icon:'🐜', label:'Hormiga'},
  {id:'CUOTA_MARTINA', icon:'👧', label:'Martina'},
  {id:'OTROS', icon:'📦', label:'Otros'},
];

const CATS_INGRESO = [
  {id:'QUINCENA', icon:'💼', label:'Quincena'},
  {id:'PRIMA', icon:'🎁', label:'Prima'},
  {id:'INGRESO_EXTRA', icon:'✨', label:'Extra'},
  {id:'REEMBOLSO', icon:'↩️', label:'Reembolso'},
  {id:'REGALO', icon:'💝', label:'Regalo'},
  {id:'INGRESO', icon:'💰', label:'Otro ingreso'},
];

let tipoSeleccionado = 'GASTO';

function catsActuales() {
  return tipoSeleccionado === 'INGRESO' ? CATS_INGRESO : CATS;
}

function catDefault() {
  return tipoSeleccionado === 'INGRESO' ? 'QUINCENA' : 'OTROS';
}

function setTipo(t) {
  tipoSeleccionado = t;
  const esIng = t === 'INGRESO';
  const clase = esIng ? 'ingreso' : 'gasto';
  document.getElementById('btnTipoGasto').className = 'tipo-btn' + (!esIng ? ' active gasto' : '');
  document.getElementById('btnTipoIngreso').className = 'tipo-btn' + (esIng ? ' active ingreso' : '');
  document.getElementById('registerForm').className = 'register-form ' + clase;
  document.getElementById('inputMonto').className = 'form-input amount-input ' + clase;
  const btn = document.getElementById('btnRegistrar');
  btn.className = 'btn-registrar ' + clase;
  btn.textContent = esIng ? 'Registrar ingreso' : 'Registrar gasto';
  document.getElementById('inputDesc').placeholder = esIng ? 'Ej: Quincena octubre' : 'Ej: Compra mercado semanal';
  catSeleccionada = catDefault();
  buildCatsGrid();
  pagoCalSel = null;
  renderPagosChips();
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let usuario = localStorage.getItem('mayordomia_user') || null;
let catSeleccionada = 'OTROS';
let respSeleccionado = 'COCOLAS';
let dashData = null;

function fmt(n) {
  return '$' + Math.round(Math.abs(n||0)).toLocaleString('es-CO');
}

function pct(a, b) {
  return b > 0 ? Math.min(100, Math.round((a/b)*100)) : 0;
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function login(persona) {
  usuario = persona;
  localStorage.setItem('mayordomia_user', persona);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  setupUser();
  cargarDatos();
  buildCatsGrid();
  setResp(persona);
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
}

// ===== FOTOS DE PERFIL (se guardan solo en este celular) =====
let fotoPara = null;

function fotoDe(persona) {
  try { return localStorage.getItem('mayordomia_foto_' + persona); } catch(e) { return null; }
}

function pintarFoto(el, persona) {
  if (!el) return;
  const f = fotoDe(persona);
  if (f) { el.style.backgroundImage = `url(${f})`; el.classList.add('con-foto'); }
  else { el.style.backgroundImage = ''; el.classList.remove('con-foto'); }
}

function pintarFotos() {
  pintarFoto(document.getElementById('avatarCOCOLAS'), 'COCOLAS');
  pintarFoto(document.getElementById('avatarALEPOSA'), 'ALEPOSA');
  if (usuario) pintarFoto(document.getElementById('userDot'), usuario);
}

function elegirFoto(ev, persona) {
  ev.stopPropagation();
  if (!persona) return;
  if (fotoDe(persona)) {
    const nombre = persona === 'COCOLAS' ? 'Cocolas' : 'Aleposa';
    if (!confirm(`¿Quieres cambiar la foto de ${nombre}?\n\nAceptar = elegir otra foto\nCancelar = dejar la actual`)) {
      if (confirm('¿Quieres quitar la foto y volver a las iniciales?')) {
        try { localStorage.removeItem('mayordomia_foto_' + persona); } catch(e) {}
        pintarFotos();
      }
      return;
    }
  }
  fotoPara = persona;
  const inp = document.getElementById('fotoInput');
  inp.value = '';
  inp.click();
}

function guardarFoto(input) {
  const file = input.files && input.files[0];
  if (!file || !fotoPara) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // Recorta en cuadrado y reduce a 200x200 para que ocupe poco espacio
      const lado = Math.min(img.width, img.height);
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 200;
      canvas.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, 200, 200);
      const data = canvas.toDataURL('image/jpeg', 0.85);
      try {
        localStorage.setItem('mayordomia_foto_' + fotoPara, data);
        pintarFotos();
        showToast('📷 Foto guardada en este celular', 'success');
      } catch(err) {
        showToast('No se pudo guardar la foto', 'error');
      }
    };
    img.onerror = () => showToast('No se pudo abrir esa imagen', 'error');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function setupUser() {
  const pill = document.getElementById('userPill');
  const dot = document.getElementById('userDot');
  const name = document.getElementById('userName');
  if (usuario === 'COCOLAS') {
    pill.className = 'user-pill cocolas';
    dot.textContent = 'NC';
    name.textContent = 'Cocolas';
  } else {
    pill.className = 'user-pill aleposa';
    dot.textContent = 'AP';
    name.textContent = 'Aleposa';
  }
  pintarFoto(dot, usuario);
}

function showTab(name, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
  if (name === 'inicio' && dashData) renderInicio();
  if (name === 'calendario' && dashData) renderCalendario();
  if (name === 'deudas' && dashData) renderDeudas();
  if (name === 'registrar') renderPagosChips();
}

function buildCatsGrid() {
  const grid = document.getElementById('catsGrid');
  grid.innerHTML = '';
  catsActuales().forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (c.id === catSeleccionada ? ' selected' : '');
    btn.innerHTML = `<span class="icon">${c.icon}</span>${c.label}`;
    btn.onclick = () => selectCat(c.id);
    btn.id = 'cat_' + c.id;
    grid.appendChild(btn);
  });
}

function selectCat(id) {
  catSeleccionada = id;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  const btn = document.getElementById('cat_' + id);
  if (btn) btn.classList.add('selected');
}

// ===== VINCULAR EL REGISTRO CON UN PAGO DEL CALENDARIO =====
let pagoCalSel = null; // {fila, descripcion}

function renderPagosChips() {
  const cont = document.getElementById('pagosChips');
  const grupo = document.getElementById('grupoPagoCal');
  if (!cont || !grupo) return;
  const cal = (dashData && dashData.calendario) || [];
  const quiereIngreso = tipoSeleccionado === 'INGRESO';
  const lista = cal.filter(c => c.fila && c.pagado !== 'SI'
      && esIngresoCal(c) === quiereIngreso
      && (c.responsable === respSeleccionado || c.responsable === 'FAMILIAR'))
    .sort((a,b) => parseInt(a.dia) - parseInt(b.dia));
  if (pagoCalSel && !lista.some(c => c.fila === pagoCalSel.fila)) pagoCalSel = null;
  document.getElementById('labelPagoCal').textContent = quiereIngreso ? '¿Es un ingreso del calendario?' : '¿Es un pago del calendario?';
  if (!lista.length) { grupo.style.display = 'none'; return; }
  grupo.style.display = '';
  let html = `<button class="pago-chip ${!pagoCalSel ? 'selected' : ''}" onclick="elegirPagoCal(null)">No</button>`;
  lista.forEach(c => {
    html += `<button class="pago-chip ${pagoCalSel && pagoCalSel.fila === c.fila ? 'selected' : ''}" onclick="elegirPagoCal(${c.fila})">${esc(c.descripcion)}<small>${fmt(c.monto)}</small></button>`;
  });
  cont.innerHTML = html;
}

function elegirPagoCal(fila) {
  if (fila === null) { pagoCalSel = null; renderPagosChips(); return; }
  const c = ((dashData && dashData.calendario) || []).find(x => x.fila === fila);
  if (!c) return;
  pagoCalSel = {fila: c.fila, descripcion: String(c.descripcion)};
  const m = document.getElementById('inputMonto');
  const d = document.getElementById('inputDesc');
  if (!m.value) m.value = parseFloat(c.monto) || '';
  if (!d.value.trim()) d.value = String(c.descripcion);
  renderPagosChips();
}

function setResp(r) {
  respSeleccionado = r;
  document.getElementById('btnCocolas').className = 'resp-btn' + (r==='COCOLAS' ? ' active cocolas' : '');
  document.getElementById('btnAleposa').className = 'resp-btn' + (r==='ALEPOSA' ? ' active aleposa' : '');
  pagoCalSel = null;
  renderPagosChips();
}

async function cargarDatos() {
  try {
    const resp = await fetch(WEBAPP_URL + '?action=getDashboard&t=' + Date.now());
    const data = await resp.json();
    dashData = data;
    renderInicio();
    renderPagosChips();
  } catch(e) {
    document.getElementById('inicioContent').innerHTML = `<div class="alert red">❌ Error al cargar datos. Verifica la conexión.</div>`;
  }
}

function renderInicio() {
  if (!dashData) return;
  const d = dashData;
  const ingC = d.ingC || 0, gasC = d.gasC || 0;
  const ingA = d.ingA || 0, gasA = d.gasA || 0;
  const arrC = d.arrC || 0, arrA = d.arrA || 0, arrFam = d.arrFam || 0;
  const saldoC = arrC + ingC - gasC, saldoA = arrA + ingA - gasA;
  const saldoFam = arrFam + (d.saldo || 0);
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const mesAnt = MESES[(new Date().getMonth() + 11) % 12];
  const sgn = n => (n < 0 ? '-' : '') + fmt(n);
  // Cuotas del mes: suma de la cuota de cada deuda activa (pestaña DEUDAS)
  const cuotasLista = (d.deudas || [])
    .filter(x => (parseFloat(x.saldo) || 0) > 0)
    .map(x => {
      let cuota = parseFloat(x.abono) || 0;
      const meses = parseFloat(x.meses) || 0;
      if (!cuota && meses > 0) cuota = Math.round((parseFloat(x.saldo) || 0) / meses);
      return {nombre: x.nombre, cuota};
    })
    .filter(x => x.cuota > 0);
  const cuotasTotal = cuotasLista.reduce((s, x) => s + x.cuota, 0);
  const hoy = new Date().getDate();

  let html = '';

  // Alertas pagos urgentes
  const cal = d.calendario || [];
  const pend = c => c.pagado !== 'SI' && !esIngresoCal(c);
  const vencidos = cal.filter(c => pend(c) && parseInt(c.dia) < hoy);
  const hoyPagos = cal.filter(c => pend(c) && parseInt(c.dia) === hoy);
  const proximos = cal.filter(c => pend(c) && parseInt(c.dia) > hoy && parseInt(c.dia) <= hoy+3);

  if (vencidos.length > 0) {
    vencidos.forEach(p => {
      html += `<div class="alert red">🚨 Vencido día ${p.dia} — ${esc(p.descripcion)} <strong>${fmt(p.monto)}</strong></div>`;
    });
  }
  if (hoyPagos.length > 0) {
    hoyPagos.forEach(p => {
      html += `<div class="alert yellow">🔴 Hoy — ${esc(p.descripcion)} <strong>${fmt(p.monto)}</strong></div>`;
    });
  }

  // Métricas
  html += `<div class="metrics-grid">
    <div class="metric-card">
      <label>Ingresos familia</label>
      <div class="val green">${fmt(ingC+ingA)}</div>
    </div>
    <div class="metric-card">
      <label>Gastos familia</label>
      <div class="val yellow">${fmt(gasC+gasA)}</div>
    </div>
    <div class="metric-card">
      <label>Disponible familia</label>
      <div class="val ${saldoFam>=0?'green':'red'}">${sgn(saldoFam)}</div>
      ${arrFam!==0?`<div style="font-size:11px;color:var(--muted);margin-top:4px">Incluye ${sgn(arrFam)} de ${mesAnt}</div>`:''}
    </div>
    <div class="metric-card" onclick="toggleCuotas()" style="cursor:pointer">
      <label>Cuotas mes <span id="cuotasFlecha" style="font-size:10px">▼</span></label>
      <div class="val red">${fmt(cuotasTotal)}</div>
      <div id="cuotasDetalle" style="display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:6px">
        ${cuotasLista.length ? cuotasLista.map(q => `<div style="display:flex;justify-content:space-between;gap:6px;font-size:11px;padding:3px 0"><span style="color:var(--muted)">${esc(q.nombre)}</span><span>${fmt(q.cuota)}</span></div>`).join('') : '<div style="font-size:11px;color:var(--muted)">Sin deudas activas 🎉</div>'}
      </div>
    </div>
  </div>`;

  // Tarjetas persona
  html += `<div class="persona-cards">
    <div class="persona-card cocolas">
      <div class="name">💙 Cocolas</div>
      <div class="persona-stat"><span>Viene de ${mesAnt}</span><span>${sgn(arrC)}</span></div>
      <div class="persona-stat"><span>Ingresos</span><span>${fmt(ingC)}</span></div>
      <div class="persona-stat"><span>Gastos</span><span>${fmt(gasC)}</span></div>
      <div class="disponible-tag ${saldoC<0?'negativo':''}">${saldoC<0?'-':''}${fmt(Math.abs(saldoC))}</div>
    </div>
    <div class="persona-card aleposa">
      <div class="name">💜 Aleposa</div>
      <div class="persona-stat"><span>Viene de ${mesAnt}</span><span>${sgn(arrA)}</span></div>
      <div class="persona-stat"><span>Ingresos</span><span>${fmt(ingA)}</span></div>
      <div class="persona-stat"><span>Gastos</span><span>${fmt(gasA)}</span></div>
      <div class="disponible-tag ${saldoA<0?'negativo':''}">${saldoA<0?'-':''}${fmt(Math.abs(saldoA))}</div>
    </div>
  </div>`;

  // Últimas transacciones
  const recientes = (d.recientes || []).slice(0, 8);
  html += `<div class="card"><div class="card-title">Últimas transacciones</div>`;
  if (recientes.length === 0) {
    html += `<div class="empty-state"><div class="icon">📭</div>Sin transacciones aún</div>`;
  } else {
    recientes.forEach((t, i) => {
      const esIng = t.tipo === 'INGRESO';
      const btnDel = t.fila ? `<button class="btn-del" id="del_${i}" onclick="eliminarRegistro(${i})" aria-label="Eliminar registro">🗑️</button>` : '';
      html += `<div class="trans-row">
        <div>
          <div class="trans-desc">${esc(t.descripcion)}</div>
          <div class="trans-meta">${esc(t.categoria)} · ${esc(t.fecha)} · ${esc(t.responsable)}</div>
        </div>
        <div class="trans-right">
          <div class="trans-amount" style="color:${esIng?'var(--green)':'var(--red)'}">${esIng?'+':'-'}${fmt(t.monto)}</div>
          ${btnDel}
        </div>
      </div>`;
    });
  }
  const MESES_M = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  html += `<button class="btn-ver-todos" onclick="abrirMovimientos()">📋 Ver todos los de ${MESES_M[new Date().getMonth()]}</button>`;
  html += `</div>`;

  html += `<div class="verse">"El que es fiel en lo muy poco, también en lo más es fiel." — Lucas 16:10</div>`;

  document.getElementById('inicioContent').innerHTML = html;
}

function esIngresoCal(c) {
  const d = String(c.descripcion || '').toUpperCase();
  return /QUINCENA|SUELDO|SALARIO|PRIMA|INGRESO|N[ÓO]MINA/.test(d);
}

function fechaPagoCorta(v) {
  if (!v) return '';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const str = String(v);
  let dia, mes;
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) { dia = parseInt(m[1]); mes = parseInt(m[2]) - 1; }
  else {
    const f = new Date(str);
    if (isNaN(f)) return str;
    const partes = new Intl.DateTimeFormat('es-CO', {timeZone:'America/Bogota', day:'numeric', month:'numeric'}).formatToParts(f);
    dia = parseInt(partes.find(x => x.type === 'day').value);
    mes = parseInt(partes.find(x => x.type === 'month').value) - 1;
  }
  return `${dia} ${MES[mes]}`;
}

function renderCalendario() {
  if (!dashData) return;
  const cal = dashData.calendario || [];
  const hoy = new Date().getDate();
  const pagos = cal.filter(c => !esIngresoCal(c));
  const ingresos = cal.filter(c => esIngresoCal(c));
  const pagado = c => c.pagado === 'SI';
  let html = '';

  const pagadosMonto = pagos.filter(pagado).reduce((s,c)=>s+parseFloat(c.monto||0),0);
  const totalMonto = pagos.reduce((s,c)=>s+parseFloat(c.monto||0),0);
  const pendientesMonto = totalMonto - pagadosMonto;
  const pctPagado = pct(pagadosMonto, totalMonto);
  const nPend = pagos.filter(c => !pagado(c)).length;

  html += `<div class="card">
    <div class="card-title">Pagos del mes</div>
    <div class="bar-wrap">
      <div class="bar-label"><span style="color:var(--muted)">Pagado</span><strong>${fmt(pagadosMonto)} / ${fmt(totalMonto)}</strong></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pctPagado}%;background:var(--green)"></div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px">
      <div style="font-size:24px;font-weight:700;color:${pctPagado>=100?'var(--green)':(pctPagado>70?'var(--green)':'var(--yellow)')}">${pctPagado}%</div>
      <div style="font-size:12px;color:var(--muted)">${nPend === 0 ? '✅ Todo pagado' : `Faltan ${nPend} · ${fmt(pendientesMonto)}`}</div>
    </div>
  </div>`;

  // Pagos agrupados por día (cualquier día del mes)
  const dias = [...new Set(pagos.map(c => parseInt(c.dia)).filter(d => !isNaN(d)))].sort((x,y)=>x-y);
  html += `<div class="card"><div class="card-title">Calendario de pagos</div>`;
  if (dias.length === 0) html += `<div class="empty-state"><div class="icon">📭</div>No hay pagos en el calendario</div>`;
  dias.forEach(dia => {
    const delDia = pagos.filter(c => parseInt(c.dia) === dia);
    const faltan = delDia.filter(c => !pagado(c)).length;
    let estado, color;
    if (faltan === 0) { estado = ' · ✅ Al día'; color = 'var(--green)'; }
    else if (dia < hoy) { estado = ' · Vencido'; color = 'var(--red)'; }
    else if (dia === hoy) { estado = ' · Hoy'; color = 'var(--red)'; }
    else if (dia <= hoy + 3) { estado = ' · Próximo'; color = 'var(--yellow)'; }
    else { estado = ''; color = 'var(--muted)'; }
    html += `<div class="day-label" style="color:${color}">Día ${dia}${estado}</div>`;
    delDia.forEach(c => {
      const ok = pagado(c);
      const fp = fechaPagoCorta(c.fechaReal);
      html += `<div class="cal-row">
        <div>
          <div class="desc">${esc(c.descripcion)}</div>
          <div class="meta">${esc(c.responsable)}${ok ? ' · Pagado' + (fp ? ' el ' + fp : '') : ' · Pendiente'}</div>
        </div>
        <div style="text-align:right">
          <div class="monto" style="color:${ok?'var(--green)':(dia < hoy ? 'var(--red)' : 'var(--text)')}">${fmt(c.monto)}</div>
          <div class="check">${ok?'✅':'⏳'}</div>
        </div>
      </div>`;
    });
  });
  html += `</div>`;

  // Ingresos esperados (aparte, no cuentan en la barra)
  if (ingresos.length) {
    html += `<div class="card"><div class="card-title">Ingresos del mes</div>`;
    ingresos.sort((x,y)=>parseInt(x.dia)-parseInt(y.dia)).forEach(c => {
      const ok = pagado(c);
      const fp = fechaPagoCorta(c.fechaReal);
      html += `<div class="cal-row">
        <div>
          <div class="desc">${esc(c.descripcion)}</div>
          <div class="meta">Día ${esc(c.dia)} · ${esc(c.responsable)}${ok ? ' · Recibido' + (fp ? ' el ' + fp : '') : ' · Por recibir'}</div>
        </div>
        <div style="text-align:right">
          <div class="monto" style="color:var(--green)">+${fmt(c.monto)}</div>
          <div class="check">${ok?'💰':'⏳'}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('calContent').innerHTML = html;
}

function renderDeudas() {
  if (!dashData) return;
  const deudas = dashData.deudas || [];
  const metas = dashData.metas || [];
  let html = '';

  html += `<div class="card"><div class="card-title">Estado de deudas</div>`;
  deudas.forEach(d => {
    const pv = pct(d.saldoInicial - d.saldo, d.saldoInicial);
    html += `<div class="deuda-row">
      <div class="bar-wrap">
        <div class="bar-label"><strong>${d.nombre}</strong><span style="color:var(--red)">${fmt(d.saldo)} restantes</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pv}%;background:var(--green)"></div></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${pv}% pagado · ${d.meses} meses · Límite: ${d.fechaLimite||'—'}</div>
      ${d.intereses&&d.intereses!=='incluido en cuota'?`<div style="font-size:11px;color:var(--red);margin-top:2px">Intereses este mes: ${fmt(d.intereses)}</div>`:''}
    </div>`;
  });
  html += `</div>`;

  html += renderPlanMoto(dashData.planMoto || []);

  html += `<div class="card"><div class="card-title">Metas activas</div>`;
  metas.forEach(m => {
    const pv = pct(m.acumulado, m.objetivo);
    const color = pv > 70 ? 'var(--green)' : pv > 30 ? 'var(--cocolas)' : 'var(--yellow)';
    html += `<div class="deuda-row">
      <div class="bar-wrap">
        <div class="bar-label"><strong>${m.nombre}</strong><span>${fmt(m.acumulado)} / ${fmt(m.objetivo)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pv}%;background:${color}"></div></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">${pv}% · ${m.estado}</div>
    </div>`;
  });
  html += `</div>`;
  html += `<div class="verse">"Los planes bien pensados dan buen resultado." — Proverbios 21:5</div>`;
  document.getElementById('deudasContent').innerHTML = html;
}

function toggleCuotas() {
  const det = document.getElementById('cuotasDetalle');
  const fl = document.getElementById('cuotasFlecha');
  if (!det) return;
  const abrir = det.style.display === 'none';
  det.style.display = abrir ? 'block' : 'none';
  if (fl) fl.textContent = abrir ? '▲' : '▼';
}

function renderPlanMoto(plan) {
  if (!plan.length) return '';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fCorta = f => { const [y,m,d] = f.split('-'); return `${parseInt(d)} ${MES[parseInt(m)-1]} ${y.slice(2)}`; };
  const pagadas = plan.filter(c => c.pagada).length;
  const proxima = plan.find(c => !c.pagada);
  const ultPagada = [...plan].reverse().find(c => c.pagada && c.saldo !== null);
  const saldoHoy = ultPagada ? ultPagada.saldo : 0;
  const ultima = plan[plan.length - 1];

  // Gráfica del saldo
  const pts = plan.filter(c => c.saldo !== null);
  const W = 340, H = 150, padL = 8, padR = 8, padT = 14, padB = 22;
  const maxS = Math.max(...pts.map(c => c.saldo));
  const x = i => padL + (i / (pts.length - 1)) * (W - padL - padR);
  const y = v => padT + (1 - v / maxS) * (H - padT - padB);
  const linea = pts.map((c, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(c.saldo).toFixed(1)}`).join(' ');
  const area = linea + ` L${x(pts.length - 1).toFixed(1)},${(H - padB)} L${x(0).toFixed(1)},${(H - padB)} Z`;
  const idxHoy = pts.findIndex(c => c === ultPagada);
  const etiquetas = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map(i =>
    `<text x="${x(i).toFixed(1)}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="${i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle')}">${fCorta(pts[i].fecha)}</text>`).join('');
  const marcaHoy = idxHoy >= 0 ? `
    <line x1="${x(idxHoy).toFixed(1)}" y1="${padT}" x2="${x(idxHoy).toFixed(1)}" y2="${H - padB}" stroke="var(--cocolas)" stroke-dasharray="3 3"/>
    <circle cx="${x(idxHoy).toFixed(1)}" cy="${y(saldoHoy).toFixed(1)}" r="4" fill="var(--cocolas)"/>
    <text x="${Math.min(x(idxHoy) + 6, W - 70).toFixed(1)}" y="${(y(saldoHoy) - 6).toFixed(1)}" font-size="10" fill="var(--cocolas)">Hoy ${fmt(saldoHoy)}</text>` : '';

  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de la moto bajando hasta ${fCorta(ultima.fecha)}">
    <path d="${area}" fill="var(--green)" opacity="0.12"/>
    <path d="${linea}" fill="none" stroke="var(--green)" stroke-width="2"/>
    ${marcaHoy}
    ${etiquetas}
  </svg>`;

  const filas = plan.map(c => `<tr class="${c.pagada ? 'pagada' : (c === proxima ? 'proxima' : '')}">
      <td>${c.pagada ? '✅' : (c === proxima ? '👉' : '')} ${c.cuota}</td>
      <td>${fCorta(c.fecha)}</td>
      <td>${fmt(c.pago)}</td>
      <td>${c.capital !== null ? fmt(c.capital) : '—'}</td>
      <td>${c.intereses !== null ? fmt(c.intereses) : '—'}</td>
      <td>${c.saldo !== null ? fmt(c.saldo) : '—'}</td>
    </tr>`).join('');

  return `<div class="card">
    <div class="card-title">Plan de pagos moto · Compensar</div>
    <div class="moto-resumen">
      <div><small>Cuotas pagadas</small><strong>${pagadas} de ${plan.length}</strong></div>
      <div><small>Debes hoy</small><strong style="color:var(--red)">${fmt(saldoHoy)}</strong></div>
      <div><small>Terminas</small><strong style="color:var(--green)">${fCorta(ultima.fecha)}</strong></div>
    </div>
    <div class="chart-wrap">${svg}</div>
    ${proxima ? `<div class="alert yellow">👉 Próxima cuota: ${fCorta(proxima.fecha)} — <strong>${fmt(proxima.pago)}</strong> (libranza)</div>` : ''}
    <div class="plan-scroll">
      <table class="plan-table">
        <thead><tr><th>#</th><th>Fecha</th><th>Cuota</th><th>Capital</th><th>Interés</th><th>Saldo</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
    <div class="plan-nota">Desde la cuota 3 el plan es un cálculo con la tasa real (1,90% mensual). Puede variar unos pesos frente al extracto de Compensar.</div>
  </div>`;
}

let registrando = false;
let ridPendiente = null, firmaPendiente = null;

async function registrarGasto() {
  if (registrando) return;
  const monto = parseFloat(document.getElementById('inputMonto').value);
  const desc = document.getElementById('inputDesc').value.trim();
  const btn = document.getElementById('btnRegistrar');

  if (!monto || monto < 500) {
    showToast('Ingresa un monto válido (mínimo $500)', 'error');
    return;
  }

  if (!catSeleccionada) {
    showToast('Selecciona una categoría', 'error');
    return;
  }

  registrando = true;
  btn.disabled = true;
  btn.textContent = 'Registrando...';

  const tipo = tipoSeleccionado;
  const label = catsActuales().find(c=>c.id===catSeleccionada)?.label || catSeleccionada;
  const nombreResp = respSeleccionado === 'COCOLAS' ? 'Cocolas' : 'Aleposa';
  const descripcion = desc || (catSeleccionada === 'QUINCENA' ? 'Quincena ' + nombreResp : label);

  try {
    const params = new URLSearchParams({
      action: 'registrar',
      descripcion,
      categoria: catSeleccionada,
      tipo,
      monto,
      responsable: respSeleccionado
    });
    // Mismo registro reintentado = mismo código, así el servidor no lo guarda dos veces
    const firma = [descripcion, monto, catSeleccionada, tipo, respSeleccionado, pagoCalSel ? pagoCalSel.fila : ''].join('|');
    if (firma !== firmaPendiente) { firmaPendiente = firma; ridPendiente = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    params.set('rid', ridPendiente);
    if (pagoCalSel) { params.set('calFila', pagoCalSel.fila); params.set('calDesc', pagoCalSel.descripcion); }

    const resp = await fetch(WEBAPP_URL + '?' + params.toString());
    const result = await resp.json();

    if (result.ok) {
      firmaPendiente = null; ridPendiente = null; pagoCalSel = null;
      const extra = result.duplicado ? ' (ya estaba registrado)' : (result.marcado ? ` · ✅ ${result.marcado} pagado` : '');
      showToast(`${tipo==='INGRESO'?'💰':'🧾'} ${descripcion} — ${fmt(monto)}${extra}`, 'success');
      document.getElementById('inputMonto').value = '';
      document.getElementById('inputDesc').value = '';
      catSeleccionada = catDefault();
      buildCatsGrid();
      await cargarDatos();
      showTab('inicio', document.querySelectorAll('.tab-btn')[0]);
    } else {
      showToast('Error al registrar: ' + (result.error||'intenta de nuevo'), 'error');
    }
  } catch(e) {
    showToast('Error de conexión. Revisa Inicio antes de volver a intentar.', 'error');
  }
  registrando = false;

  btn.disabled = false;
  btn.textContent = tipoSeleccionado === 'INGRESO' ? 'Registrar ingreso' : 'Registrar gasto';
}

// ===== MOVIMIENTOS DEL MES =====
let movMes = new Date().getMonth(), movAnio = new Date().getFullYear();
let movLista = [], movPersona = 'TODOS', movTipo = 'TODO', movCargando = false;
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function abrirMovimientos() {
  movMes = new Date().getMonth(); movAnio = new Date().getFullYear();
  document.getElementById('movOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
  cargarMovimientos();
}

function cerrarMovimientos() {
  document.getElementById('movOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

function cambiarMesMov(delta) {
  movMes += delta;
  if (movMes < 0) { movMes = 11; movAnio--; }
  if (movMes > 11) { movMes = 0; movAnio++; }
  cargarMovimientos();
}

async function cargarMovimientos() {
  const hoy = new Date();
  document.getElementById('movMes').textContent = `${MESES_L[movMes]} ${movAnio}`;
  document.getElementById('movSig').disabled = (movAnio > hoy.getFullYear()) || (movAnio === hoy.getFullYear() && movMes >= hoy.getMonth());
  document.getElementById('movBody').innerHTML = `<div class="loading-state"><div class="spinner"></div> Cargando movimientos...</div>`;
  movCargando = true;
  try {
    const resp = await fetch(`${WEBAPP_URL}?action=movimientos&mes=${movMes}&anio=${movAnio}&t=${Date.now()}`);
    const r = await resp.json();
    movLista = r.movimientos || [];
    renderMovimientos();
  } catch(e) {
    document.getElementById('movBody').innerHTML = `<div class="alert red">❌ No se pudieron cargar los movimientos. Revisa la conexión.</div>`;
  }
  movCargando = false;
}

function filtrarMov(campo, valor) {
  if (campo === 'persona') movPersona = valor; else movTipo = valor;
  renderMovimientos();
}

function renderMovimientos() {
  const lista = movLista.filter(t =>
    (movPersona === 'TODOS' || t.responsable === movPersona) &&
    (movTipo === 'TODO' || (movTipo === 'INGRESO' ? t.tipo === 'INGRESO' : t.tipo !== 'INGRESO')));
  const ing = lista.filter(t => t.tipo === 'INGRESO').reduce((s,t) => s + t.monto, 0);
  const gas = lista.filter(t => t.tipo !== 'INGRESO').reduce((s,t) => s + t.monto, 0);
  const f = (c, v, txt, act) => `<button class="mov-filtro ${act === v ? 'active' : ''}" onclick="filtrarMov('${c}','${v}')">${txt}</button>`;

  let html = `<div class="mov-filtros">
      ${f('persona','TODOS','Todos',movPersona)}${f('persona','COCOLAS','💙 Cocolas',movPersona)}${f('persona','ALEPOSA','💜 Aleposa',movPersona)}
    </div>
    <div class="mov-filtros">
      ${f('tipo','TODO','Todo',movTipo)}${f('tipo','GASTO','🧾 Gastos',movTipo)}${f('tipo','INGRESO','💰 Ingresos',movTipo)}
    </div>
    <div class="mov-resumen">
      <div><small>Ingresos</small><strong style="color:var(--green)">${fmt(ing)}</strong></div>
      <div><small>Gastos</small><strong style="color:var(--red)">${fmt(gas)}</strong></div>
      <div><small>Movimientos</small><strong>${lista.length}</strong></div>
    </div>`;

  if (!lista.length) {
    html += `<div class="card"><div class="empty-state"><div class="icon">📭</div>No hay movimientos con estos filtros</div></div>`;
  } else {
    let diaActual = null;
    html += `<div class="card">`;
    lista.forEach((t, i) => {
      if (t.fecha !== diaActual) {
        diaActual = t.fecha;
        const tot = lista.filter(x => x.fecha === t.fecha && x.tipo !== 'INGRESO').reduce((s,x) => s + x.monto, 0);
        html += `<div class="day-label" style="color:var(--muted);display:flex;justify-content:space-between"><span>${t.dia} de ${MESES_L[movMes]}</span>${tot ? `<span>-${fmt(tot)}</span>` : ''}</div>`;
      }
      const esIng = t.tipo === 'INGRESO';
      html += `<div class="trans-row">
        <div>
          <div class="trans-desc">${esc(t.descripcion)}</div>
          <div class="trans-meta">${esc(t.categoria)} · ${esc(t.responsable)}</div>
        </div>
        <div class="trans-right">
          <div class="trans-amount" style="color:${esIng?'var(--green)':'var(--red)'}">${esIng?'+':'-'}${fmt(t.monto)}</div>
          <button class="btn-del" id="movdel_${i}" onclick="eliminarMov(${i})" aria-label="Eliminar registro">🗑️</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  movVisibles = lista;
  document.getElementById('movBody').innerHTML = html;
}

let movVisibles = [];
async function eliminarMov(i) {
  const t = movVisibles[i];
  if (!t) return;
  const ok = await eliminarTransaccionApp(t, 'movdel_' + i);
  if (ok) cargarMovimientos();
}

async function eliminarTransaccionApp(t, btnId) {
  const signo = t.tipo === 'INGRESO' ? '+' : '-';
  if (!confirm(`¿Eliminar este registro?\n\n${t.descripcion}\n${signo}${fmt(t.monto)} · ${t.fecha} · ${t.responsable}\n\nSe borrará también del Sheets.`)) return false;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner" style="width:14px;height:14px"></div>'; }
  try {
    const params = new URLSearchParams({ action: 'eliminar', fila: t.fila, descripcion: t.descripcion, monto: t.monto });
    const resp = await fetch(WEBAPP_URL + '?' + params.toString());
    const result = await resp.json();
    if (result.ok) showToast('🗑️ Registro eliminado', 'success');
    else showToast(result.error || 'No se pudo eliminar. Recarga e intenta de nuevo.', 'error');
    await cargarDatos();
    return true;
  } catch(e) {
    showToast('Error de conexión. El registro no se eliminó.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '🗑️'; }
    return false;
  }
}

async function eliminarRegistro(i) {
  const t = (dashData && dashData.recientes || [])[i];
  if (!t || !t.fila) return;
  await eliminarTransaccionApp(t, 'del_' + i);
}

pintarFotos();

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  setupUser();
  cargarDatos();
  buildCatsGrid();
  setResp(usuario);
}
